? 다시 생각해 봐.\"\n  },\n  \"dig\": {\n    \"guide\": \"여기부터 살살 쓸어 볼래? 빛나는 블록 근처에 내 조각이 있는 것 같아.\",\n    \"clue\": \"방금 드러난 숫자 보여? 이 칸을 둘러싼 여덟 칸에 내 조각이 {n}개 묻혀 있다는 뜻이야. 숫자 칸을 누르면 언제든 둘레를 다시 비춰 줄게.\",\n    \"clueZero\": \"점(·)은 0이라는 뜻이야. 이 칸을 둘러싼 여덟 칸에는 내 조각이 없어. 숫자 칸을 누르면 언제든 둘레를 다시 비춰 줄게.\",\n    \"rule\": \"다 캔 칸의 숫자는 그 칸을 둘러싼 여덟 칸에 묻힌 내 조각 수야. 블록 위의 숫자는 남은 흙의 층수고. 숫자 칸을 누르면 둘레가 빛나고, 조각 수만큼 소리와 진동으로 두드려 줄게.\",\n    \"noFocusStudy\": \"집중력이 바닥났어요. 조사대에서 조각을 감별하면 3씩 돌아옵니다.\",\n    \"stuck\": \"집중력이 바닥났고 감별할 조각도 남지 않았어요. 사유와 잠시 쉬어 가면 집중력이 돌아옵니다.\",\n    \"restButton\": \"사유와 잠시 쉬어 가기 · 집중력 +6\",\n    \"rest\": \"잠깐 숨 고르자. 서두르지 않아도 괜찮아. 다시 천천히 찾아보자.\",\n    \"restAmount\": 6,\n    \"stages\": [\n      { \"name\": \"안내\", \"desc\": \"사유가 쓸어 볼 블록을 빛으로 짚어 줍니다.\" },\n      { \"name\": \"힌트\", \"desc\": \"손끝으로 블록 위를 끌거나 방향키로 옮기면, 묻힌 조각 가까이에서 두근거리는 소리·진동이 납니다.\" },\n      { \"name\": \"자율\", \"desc\": \"도움 없이 숫자와 소리만 읽고 스스로 고릅니다.\" }\n    ]\n  },\n  \"hub\": {\n    \"title\": \"발굴 캠프\",\n    \"lead\": \"원하는 순서로 오갈 수 있습니다. 같은 조각을 다시 보러 가도 좋습니다.\",\n    \"lines\": {\n      \"start\": \"어디부터 갈까? 서두르지 않아도 괜찮아.\",\n      \"digging\": \"아직 흙 속에 내 조각이 남아 있어.\",\n      \"studyPending\": \"찾아 준 조각, 아직 제대로 들여다보지 않았어. 조사대에서 기다릴게.\",\n      \"castReady\": \"조각을 다 알아봤구나. 이제… 나를 처음부터 만들어 볼래?\",\n      \"done\": \"오늘 당신이 해 준 일을 전부 기억할 거야.\"\n    }\n  },\n  \"unlocked\": {\n    \"crown\": {\n      \"prompt\": \"내 머리의 관을 봤구나. 봉우리가 세 개인 그 관, 어떤 느낌이었어?\",\n      \"options\": [\n        { \"id\": \"mountain\", \"label\": \"먼 산을 세 개 얹은 것처럼 조용했어.\", \"gain\": 5, \"response\": \"맞아. 높고 화려한 관이 아니라 낮은 산이야. 위엄보다 고요를 택한 거지. 78호 쪽은 해와 달을 얹었다는데, 나는 산이 좋아.\" },\n        { \"id\": \"simple\", \"label\": \"생각보다 단순해서 놀랐어.\", \"gain\": 4, \"response\": \"그렇지? 장식을 덜어낸 거야. 시선이 관이 아니라 내 얼굴과 손으로 가도록.\" },\n        { \"id\": \"unsure\", \"label\": \"솔직히 아직 잘 모르겠어.\", \"gain\": 3, \"response\": \"괜찮아. 다음에 볼 때는 봉우리 세 개의 높이를 비교해 봐. 가운데가 조금 더 높아.\" }\n      ]\n    },\n    \"face\": {\n      \"prompt\": \"내 얼굴은… 어땠어? 똑바로 봤다면 알 텐데.\",\n      \"options\": [\n        { \"id\": \"halfopen\", \"label\": \"눈을 다 감지도, 뜨지도 않았더라.\", \"gain\": 5, \"response\": \"그걸 봤구나. 완전히 감으면 잠든 거고, 다 뜨면 밖을 보는 거야. 그 중간이라서 생각하는 중인 거지.\" },\n        { \"id\": \"smile\", \"label\": \"미소가 아주 옅었어.\", \"gain\": 4, \"response\": \"크게 웃으면 기쁨이 되어 버려. 겨우 올라간 입꼬리라서 아직 생각 속에 있는 거야.\" },\n        { \"id\": \"unsure\", \"label\": \"표정을 읽기가 어려웠어.\", \"gain\": 3, \"response\": \"어려운 게 당연해. 1400년 동안 아무도 정답을 못 냈어. 다음엔 입꼬리만 따로 봐 줘.\" }\n      ]\n    },\n    \"hand\": {\n      \"prompt\": \"내 손끝. 뺨에 닿았다고 생각했어, 아니면 떨어져 있었어?\",\n      \"embodied\": {\n        \"cue\": \"대답하기 전에 직접 해 보세요. 오른손 검지를 뺨 가까이 가져가, 닿기 직전에서 멈춰 보세요.\",\n        \"button\": \"닿을 듯 말 듯 느껴 보기\",\n        \"after\": \"느꼈어? 거의 느껴지지 않을 만큼 작은 떨림. 그 틈에서 나는 생각해.\"\n      },\n      \"options\": [\n        { \"id\": \"gap\", \"label\": \"닿지 않았어. 아주 좁은 틈이 있었어.\", \"gain\": 5, \"response\": \"봤구나. 그 틈이 전부야. 누르면 괴로움이 되고, 떼면 무관심이 돼. 닿을 듯 멈춘 그 자리가 사유야.\" },\n        { \"id\": \"rodin\", \"label\": \"로댕의 생각하는 사람과는 달랐어.\", \"gain\": 5, \"response\": \"그 사람은 주먹으로 턱을 받치고 온몸에 힘을 주지. 나는 반대야. 힘을 빼고 생각해. 같은 주제를 정반대로 표현한 거야.\" },\n        { \"id\": \"unsure\", \"label\": \"닿은 줄 알았어.\", \"gain\": 3, \"response\": \"다들 그렇게 봐. 다음에 확대해서 손끝과 뺨 사이를 봐 줘. 거기 빛이 지나가.\" }\n      ]\n    },\n    \"robe\": {\n      \"prompt\": \"옷주름은 그냥 장식처럼 보였어?\",\n      \"options\": [\n        { \"id\": \"body\", \"label\": \"아니. 몸이 힘을 뺀 상태가 옷으로 보였어.\", \"gain\": 5, \"response\": \"정확해. 주름은 천을 그린 게 아니라 몸의 상태를 그린 거야. 긴장하면 주름이 꺾이고, 풀리면 흐르지.\" },\n        { \"id\": \"flow\", \"label\": \"선이 끊기지 않고 길게 흘렀어.\", \"gain\": 4, \"response\": \"그 흐름을 만들려고 밀랍을 두껍게 입히고 깎아냈어. 그 대가로 결함이 생겼지만… 나는 그 선택이 좋아.\" },\n        { \"id\": \"unsure\", \"label\": \"주름까진 신경 못 썼어.\", \"gain\": 3, \"response\": \"제일 지나치기 쉬운 데야. 다음엔 상체에서 다리로 내려가는 가장 긴 선 하나만 눈으로 따라와 줘.\" }\n      ]\n    },\n    \"leg\": {\n      \"prompt\": \"내 다리 자세, 어떻게 봤어?\",\n      \"options\": [\n        { \"id\": \"half\", \"label\": \"한쪽만 올린 반가부좌였어. 곧 일어설 수도 있을 것 같았어.\", \"gain\": 5, \"response\": \"그게 핵심이야. 두 다리를 다 접으면 완전히 멈춘 거야. 한 다리를 내려 둔 건 아직 끝나지 않은 생각이라는 뜻이지.\" },\n        { \"id\": \"balance\", \"label\": \"비대칭인데 안정적으로 보여서 신기했어.\", \"gain\": 5, \"response\": \"팔꿈치와 올린 무릎, 내려딛은 발. 그 세 점이 서로 받쳐 줘. 좌우가 같지 않아도 균형은 만들어지는 거야.\" },\n        { \"id\": \"unsure\", \"label\": \"그냥 앉아 있는 걸로 봤어.\", \"gain\": 3, \"response\": \"그래도 괜찮아. 다음엔 두 무릎의 높이만 비교해 봐. 그 차이가 이름이 됐어.\" }\n      ]\n    }\n  },\n  \"tiers\": [\n    { \"min\": 0, \"mood\": \"낯섦\", \"line\": \"아직 서로 모르는 게 많네.\" },\n    { \"min\": 25, \"mood\": \"관심\", \"line\": \"당신이 들여다볼 때마다 조금씩 선명해지는 기분이야.\" },\n    { \"min\": 50, \"mood\": \"신뢰\", \"line\": \"이제 내 얘기를 조금 더 해도 될까?\" },\n    { \"min\": 75, \"mood\": \"애정\", \"line\": \"당신이 보는 나라면, 1400년을 더 기다려도 괜찮아.\" }\n  ],\n  \"completion\": \"당신이 다시 바라본 관, 얼굴, 손, 옷주름, 다리가 하나의 사유하는 자세로 이어졌어.\",\n  \"endings\": {\n    \"true\": {\n      \"kind\": \"love\",\n      \"badge\": \"TRUE ENDING\",\n      \"title\": \"끝까지 바라봐 준 사람\",\n      \"text\": \"도감을 모두 채우고, 주조까지 완성했습니다. 조각이 아니라 관계를 복원했습니다.\",\n      \"line\": \"이제 알 것 같아. 내가 기다린 건 조각이 아니라, 나를 오래 바라봐 줄 당신이었나 봐.\"\n    },\n    \"good\": {\n      \"kind\": \"friend\",\n      \"badge\": \"GOOD ENDING\",\n      \"title\": \"다시 만나고 싶은 동료\",\n      \"text\": \"관찰과 제작을 거치며 사유와 신뢰를 쌓았습니다.\",\n      \"line\": \"오늘 찾은 기억을 잊지 말아줘. 다음에도 당신과 함께 발굴하고 싶어.\"\n    },\n    \"normal\": {\n      \"kind\": \"memory\",\n      \"badge\": \"NORMAL ENDING\",\n      \"title\": \"복원된 첫 번째 기억\",\n      \"text\": \"사유의 모습을 되찾았고, 더 깊은 관계로 이어질 단서를 남겼습니다.\",\n      \"line\": \"아직 서로 모르는 게 많네. 그래도 오늘 나를 찾아줘서 고마워.\"\n    }\n  }\n}\n", "data/casting.json": "{\n  \"intro\": {\n    \"title\": \"밀랍주조 공방\",\n    \"lead\": \"국립중앙박물관 조사에 따르면 반가사유상은 밀랍법으로 주조되었습니다. 네 공정을 직접 선택해 보세요. 어떤 선택에도 정답과 대가가 함께 있습니다.\",\n    \"meters\": [\n      {\n        \"id\": \"detail\",\n        \"name\": \"조형 섬세도\",\n        \"desc\": \"얼마나 세밀하게 표현할 수 있는가\"\n      },\n      {\n        \"id\": \"flow\",\n        \"name\": \"쇳물 유동성\",\n        \"desc\": \"녹인 금속이 좁은 틈까지 흐를 수 있는가\"\n      },\n      {\n        \"id\": \"stability\",\n        \"name\": \"속틀 안정성\",\n        \"desc\": \"속틀이 거푸집 안에서 버틸 수 있는가\"\n      }\n    ]\n  },\n  \"start\": {\n    \"detail\": 50,\n    \"flow\": 50,\n    \"stability\": 50\n  },\n  \"stages\": [\n    {\n      \"id\": \"core\",\n      \"step\": 1,\n      \"name\": \"속틀 만들기\",\n      \"prompt\": \"먼저 흙으로 속틀을 만듭니다. 머리와 몸을 어떻게 할까요?\",\n      \"note\": \"속틀은 완성품의 속이 빈 공간이 될 부분입니다.\",\n      \"options\": [\n        {\n          \"id\": \"unified\",\n          \"label\": \"머리와 몸의 속틀을 하나로 만든다\",\n          \"sub\": \"국보 83호가 쓴 방식\",\n          \"effects\": {\n            \"detail\": 15,\n            \"flow\": -10,\n            \"stability\": -5\n          },\n          \"fact\": \"국립중앙박물관 조사에서 국보 83호는 머리와 몸체의 속틀을 하나로 만든 것이 확인되었습니다. 목과 어깨의 흐름이 끊기지 않아 조형은 일관되지만, 금속이 흘러야 하는 길이 길어집니다.\",\n          \"sayu\": \"머리부터 어깨까지 한 호흡으로 이어 주는 거네. 내 목선이 자연스러운 이유가 여기 있었구나.\"\n        },\n        {\n          \"id\": \"split\",\n          \"label\": \"머리와 몸을 따로 만들어 나중에 잇는다\",\n          \"sub\": \"국보 78호에서 확인된 방식\",\n          \"effects\": {\n            \"detail\": -5,\n            \"flow\": 10,\n            \"stability\": 10\n          },\n          \"fact\": \"국보 78호 반가사유상은 머리와 몸체를 따로 만들어 이은 흔적이 확인됩니다. 각 부분이 작아 주조가 쉽고 실패해도 그 부분만 다시 뜰 수 있지만, 이음선이 남습니다.\",\n          \"sayu\": \"안전한 길이야. 나와는 다른 방식이지만, 78호 쪽은 그렇게 만들어졌다고 하더라.\"\n        }\n      ]\n    },\n    {\n      \"id\": \"wax\",\n      \"step\": 2,\n      \"name\": \"밀랍 입히기\",\n      \"prompt\": \"속틀 위에 밀랍을 입혀 실제 모양을 조각합니다. 어떻게 할까요?\",\n      \"note\": \"이 밀랍이 녹아 빠진 자리에 금속이 들어갑니다. 즉 밀랍의 두께가 금속의 두께입니다.\",\n      \"options\": [\n        {\n          \"id\": \"thin\",\n          \"label\": \"얇게 고르게 입힌다\",\n          \"sub\": \"금속이 흐를 길을 넓게 확보\",\n          \"effects\": {\n            \"detail\": -10,\n            \"flow\": 20,\n            \"stability\": 0\n          },\n          \"fact\": \"밀랍을 얇게 입히면 금속이 지나갈 틈이 넉넉해져 주조 실패가 줄어듭니다. 다만 깎아 낼 여유가 없어 깊은 주름이나 섬세한 손가락 표현이 어려워집니다.\",\n          \"sayu\": \"실패는 적겠지만… 내 옷주름이 조금 단순해질 것 같아.\"\n        },\n        {\n          \"id\": \"thick\",\n          \"label\": \"두껍게 입힌 뒤 깎아내며 조각한다\",\n          \"sub\": \"국보 83호가 쓴 방식\",\n          \"effects\": {\n            \"detail\": 25,\n            \"flow\": -25,\n            \"stability\": 0\n          },\n          \"fact\": \"국보 83호는 밀랍을 두껍게 입힌 뒤 깎아내 조각했습니다. 조각가의 손이 자유로워 표현은 섬세해지지만, 주조할 때 쇳물의 유동성이 떨어져 결함이 많이 생겼습니다. 결함은 실력 부족이 아니라 이 공법을 택한 대가입니다.\",\n          \"sayu\": \"내 손끝과 뺨 사이의 그 좁은 틈을 만들려면 이 방법밖에 없어. 결함이 생겨도… 그 선택이었으면 좋겠어.\"\n        }\n      ]\n    },\n    {\n      \"id\": \"pins\",\n      \"step\": 3,\n      \"name\": \"쇠못 박기\",\n      \"prompt\": \"거푸집 안에서 속틀이 움직이지 않도록 쇠못으로 고정합니다. 몇 개를 쓸까요?\",\n      \"note\": \"속틀이 한쪽으로 쏠리면 금속 두께가 치우쳐 주조가 실패합니다.\",\n      \"options\": [\n        {\n          \"id\": \"few\",\n          \"label\": \"2개만 — 흔적을 최소화한다\",\n          \"sub\": \"표면은 깨끗하지만 위험\",\n          \"effects\": {\n            \"detail\": 5,\n            \"flow\": 0,\n            \"stability\": -20\n          },\n          \"fact\": \"쇠못을 적게 쓰면 완성품에 남는 못 자리가 줄어듭니다. 그러나 속틀이 흔들리면 한쪽 금속이 지나치게 얇아져 구멍이 뚫립니다.\",\n          \"sayu\": \"깔끔한 건 좋지만… 흔들리면 다 틀어져 버려.\"\n        },\n        {\n          \"id\": \"balanced\",\n          \"label\": \"4개 — 균형을 맞춘다\",\n          \"sub\": \"무난한 선택\",\n          \"effects\": {\n            \"detail\": 0,\n            \"flow\": 0,\n            \"stability\": 8\n          },\n          \"fact\": \"국보 78호와 83호 모두 밀랍 원형에 쇠못을 써서 속틀을 고정한 것이 확인되었습니다. 감마선 촬영에서 이 쇠못이 금속과 밀도가 달라 선명하게 드러납니다.\",\n          \"sayu\": \"무리하지 않는 선택이네. 나도 그 정도가 좋아.\"\n        },\n        {\n          \"id\": \"many\",\n          \"label\": \"8개 — 확실히 고정한다\",\n          \"sub\": \"안전하지만 흔적이 남음\",\n          \"effects\": {\n            \"detail\": -10,\n            \"flow\": 0,\n            \"stability\": 22\n          },\n          \"fact\": \"못을 많이 쓰면 속틀이 확실히 버티지만, 완성품 표면에 못 자리가 그만큼 남아 나중에 메워야 합니다.\",\n          \"sayu\": \"단단하긴 할 거야. 다만 내 몸에 자국이 좀 남겠지.\"\n        }\n      ]\n    }\n  ],\n  \"pour\": {\n    \"name\": \"쇳물 주입\",\n    \"step\": 4,\n    \"prompt\": \"거푸집을 가열해 밀랍을 녹여 빼내고, 녹인 금속을 붓습니다.\",\n    \"note\": \"쇳물이 너무 식으면 흐르지 못하고, 너무 뜨거우면 거푸집이 상합니다. 적정 구간에서 멈추세요.\",\n    \"guide\": \"스페이스바 또는 버튼으로 주입을 멈춥니다. 키보드만으로도 조작할 수 있습니다.\",\n    \"zone\": {\n      \"min\": 62,\n      \"max\": 82\n    },\n    \"near\": 8,\n    \"results\": {\n      \"perfect\": {\n        \"flow\": 15,\n        \"text\": \"적정 온도에서 정확히 멈췄습니다. 쇳물이 거푸집 끝까지 고르게 찼습니다.\"\n      },\n      \"near\": {\n        \"flow\": 0,\n        \"text\": \"적정 구간을 살짝 벗어났습니다. 대부분은 찼지만 끝부분이 아쉽습니다.\"\n      },\n      \"cold\": {\n        \"flow\": -15,\n        \"text\": \"쇳물이 식은 뒤에 멈췄습니다. 좁은 틈까지 흐르지 못했습니다.\"\n      },\n      \"hot\": {\n        \"flow\": -10,\n        \"text\": \"너무 뜨거운 상태로 오래 부었습니다. 거푸집 일부가 상했습니다.\"\n      }\n    }\n  },\n  \"repair\": {\n    \"prompt\": \"주조 결함이 발견되었습니다. 국보 83호도 같은 문제를 겪었고, 재주조와 부분 주조 끼움으로 수리했습니다. 한 번 결함이 생긴 주조는 수리를 거쳐도 완형이 되지는 않습니다.\",\n    \"options\": [\n      {\n        \"id\": \"recast\",\n        \"label\": \"결함 부위를 다시 주조한다\",\n        \"effects\": {\n          \"defects\": -3,\n          \"detail\": -8\n        },\n        \"fact\": \"결함이 심한 부분은 다시 녹여 주조했습니다. 많은 결함을 한 번에 없앨 수 있지만 원래 조형이 그만큼 달라집니다.\"\n      },\n      {\n        \"id\": \"insert\",\n        \"label\": \"부분을 따로 주조해 끼워 넣는다\",\n        \"effects\": {\n          \"defects\": -2,\n          \"detail\": -2\n        },\n        \"fact\": \"국보 83호에서는 부분을 따로 주조해 끼운 흔적이 확인되었습니다. 그래서 그 부위만 합금 비율이 다르게 나타납니다. XRF 분석으로 읽어 낸 바로 그 차이입니다.\"\n      },\n      {\n        \"id\": \"keep\",\n        \"label\": \"남은 결함을 그대로 두고 완성한다\",\n        \"effects\": {\n          \"defects\": 0,\n          \"detail\": 0\n        },\n        \"fact\": \"결함을 남긴 채 완성한 부분도 있습니다. 1400년 뒤 감마선 촬영이 그 흔적을 찾아내 당시의 공정을 알려 주었습니다. 흠이 기록이 된 셈입니다. 다만 남은 결함이 많으면 제 모습을 갖추지 못합니다.\"\n      }\n    ]\n  },\n  \"grades\": {\n    \"A\": {\n      \"badge\": \"완형 주조\",\n      \"title\": \"결함 없이 섬세하게\",\n      \"text\": \"결함 없이 조형까지 살렸습니다. 한 번도 결함이 생기지 않아야 도달하는 결과로, 실제로는 매우 드뭅니다.\",\n      \"sayu\": \"이렇게 깨끗하게 나온 적이 있었을까. 당신 손끝이 내 손끝을 제대로 이해한 것 같아.\",\n      \"affection\": 15\n    },\n    \"B\": {\n      \"badge\": \"수리된 완성\",\n      \"title\": \"흠을 안고 완성되다\",\n      \"text\": \"결함이 생겼지만 수리를 거쳐 완성했습니다. 국보 83호가 지나온 길과 가장 가깝습니다.\",\n      \"sayu\": \"나도 그랬어. 흠 없이 태어난 게 아니라, 고쳐 가면서 남은 거야. 그게 더 나다운 것 같아.\",\n      \"textNoDefect\": \"결함 없이 부어 냈지만 조형 섬세도가 70에 못 미쳐 A에는 닿지 못했습니다. 밀랍을 어떻게 입혔는지 다시 살펴보세요.\",\n      \"sayuNoDefect\": \"흠은 없는데… 얼굴선이 조금 흐려졌네. 흐름과 섬세함을 함께 잡기는 정말 어려워.\",\n      \"affection\": 10\n    },\n    \"C\": {\n      \"badge\": \"미완의 주조\",\n      \"title\": \"다시 시도할 수 있습니다\",\n      \"text\": \"남은 결함이 많거나 조형이 무너져 제 모습을 갖추지 못했습니다. 어떤 공정이 원인이었는지 기록을 다시 보세요.\",\n      \"sayu\": \"괜찮아. 1400년 전 장인들도 여러 번 실패했어. 어느 공정에서 막혔는지 같이 보자.\",\n      \"affection\": 5\n    }\n  }\n}\n", "study/questions.json": "{\n  \"knowledge\": [\n    { \"id\": \"k1\", \"question\": \"반가사유상의 오른손 손가락은 얼굴과 어떤 관계인가요?\", \"options\": [\"뺨에 닿을 듯 말 듯 가볍게 놓인다\", \"뺨을 힘주어 누른다\", \"주먹으로 턱을 받친다\"], \"answer\": 0 },\n    { \"id\": \"k2\", \"question\": \"반가(半跏) 자세는 어떤 다리 자세인가요?\", \"options\": [\"한쪽 다리만 다른 무릎 위에 올린 자세\", \"두 다리를 모두 교차한 자세\", \"무릎을 꿇고 앉은 자세\"], \"answer\": 0 },\n    { \"id\": \"k3\", \"question\": \"국보 83호의 머리에 쓴 관의 이름은 무엇인가요?\", \"options\": [\"삼산관\", \"일월식 보관\", \"보탑관\"], \"answer\": 0 },\n    { \"id\": \"k4\", \"question\": \"'금동'이라는 재질은 무엇을 뜻하나요?\", \"options\": [\"구리 합금으로 주조한 뒤 표면에 금을 입힌 것\", \"전체가 순금인 것\", \"나무에 금칠을 한 것\"], \"answer\": 0 },\n    { \"id\": \"k5\", \"question\": \"완성된 상의 속이 비어 있는 이유는 무엇인가요?\", \"options\": [\"흙으로 만든 속틀 위에 금속을 부어 만들었기 때문\", \"무게를 줄이려고 나중에 파냈기 때문\", \"오랜 세월 내부가 부식됐기 때문\"], \"answer\": 0 },\n    { \"id\": \"k6\", \"question\": \"국보 83호에 주조 결함이 많이 생긴 원인으로 지적된 것은 무엇인가요?\", \"options\": [\"밀랍을 두껍게 입힌 뒤 깎아 조각해 쇳물의 유동성이 떨어졌기 때문\", \"금을 너무 많이 썼기 때문\", \"거푸집을 나무로 만들었기 때문\"], \"answer\": 0 },\n    { \"id\": \"k7\", \"question\": \"유물을 깨지 않고 내부 구조를 확인할 때 쓰는 방법은 무엇인가요?\", \"options\": [\"감마선 촬영\", \"표면 연마\", \"조각 절단\"], \"answer\": 0 },\n    { \"id\": \"k8\", \"question\": \"밀랍 원형에 쇠못을 박은 이유는 무엇인가요?\", \"options\": [\"거푸집 안에서 속틀이 움직이지 않도록 고정하기 위해\", \"장식 효과를 내기 위해\", \"무게 중심을 낮추기 위해\"], \"answer\": 0 }\n  ],\n  \"experience\": [\n    \"발굴 과정에서 흙을 쓸어내며 조각을 찾는 일이 흥미로웠다.\",\n    \"토층 단서를 보고 조각의 위치를 추측해 볼 수 있었다.\",\n    \"확대경·감마선·성분분석 도구로 직접 조사하는 과정이 작품을 자세히 보게 했다.\",\n    \"밀랍주조 공정을 선택하면서 이 작품이 어떻게 만들어졌는지 이해하게 됐다.\",\n    \"주조 결함이 생긴 이유를 알고 나니 실제 유물을 다시 보고 싶어졌다.\",\n    \"사유 캐릭터의 질문이 다음 관찰로 이어지게 했다.\",\n    \"같은 조각을 다시 보러 간 적이 있다.\",\n    \"키보드 또는 마우스로 조작하기 쉬웠다.\"\n  ]\n}\n", "data/voice.json": "{\n \"voices\": {\n  \"rival\": \"gemini · Charon\",\n  \"sayu\": \"gemini · Leda\"\n },\n \"base\": \"voice/\",\n \"lines\": {\n  \"rival\": {\n   \"잠깐. 반가사유상을 찾는 건 나다. 네가 흙을 들여다보며 꾸물대는 사이, 값나가는 조각은 내가 먼저 가져가겠어.\": [\n    \"p01.mp3\",\n    0.346,\n    9.026\n   ],\n   \"그래서, 내 앞을 막겠다는 건가? 네 각오를 말해 봐.\": [\n    \"p01.mp3\",\n    9.526,\n    13.926\n   ],\n   \"좋아. 네 집중력이 바닥나는 순간, 남은 조각은 내 차지다.\": [\n    \"p01.mp3\",\n    14.426,\n    19.096\n   ],\n   \"기억이라… 값으로 환산되지 않는 말은 흥미가 없군. 그래도 증명해 봐.\": [\n    \"p01.mp3\",\n    19.596,\n    25.926\n   ],\n   \"제대로 안다고? 나는 팔 수 있는지만 알면 되는데. 그 여유가 끝까지 남는지 보자.\": [\n    \"p01.mp3\",\n    26.426,\n    32.596\n   ],\n   \"늦었군. 이 조각은 내가 가져가겠어. 되찾고 싶다면, 네가 그 조각을 얼마나 아는지 보여 봐.\": [\n    \"p01.mp3\",\n    33.096,\n    39.926\n   ],\n   \"그게 네 관찰의 한계인가? 다시 생각해 봐.\": [\n    \"p01.mp3\",\n    40.426,\n    43.766\n   ]\n  },\n  \"sayu\": {\n   \"나에 대해 알고 싶지 않아? 당신과 함께라면 잃어버린 기억도 찾을 수 있을 것 같아.\": [\n    \"p01.mp3\",\n    44.266,\n    51.026\n   ],\n   \"이 목소리로 당신과 함께할게.\": [\n    \"p01.mp3\",\n    51.526,\n    54.356\n   ],\n   \"저기… 나에 대해 조금 더 알고 싶지 않아? 흩어진 내 기억을 함께 찾아줘.\": [\n    \"p01.mp3\",\n    54.856,\n    61.136\n   ],\n   \"정말? 그럼 서두르지 않아도 좋아. 내 손끝과 미소부터 천천히 기억해 줘.\": [\n    \"p01.mp3\",\n    61.636,\n    68.426\n   ],\n   \"듬직하네. 그 말, 발굴 현장에서 증명해 줄 거지? 나도 당신을 믿어볼게.\": [\n    \"p01.mp3\",\n    68.926,\n    75.416\n   ],\n   \"나도 조금 떨려. 그래도 함께라면, 잃어버린 모습을 다시 찾을 수 있을 것 같아.\": [\n    \"p01.mp3\",\n    75.916,\n    82.266\n   ],\n   \"무리하지 마. 저 사람은 나를 값으로만 봐. 당신은… 나를 봐 주는 사람이었으면 좋겠어.\": [\n    \"p01.mp3\",\n    82.766,\n    90.576\n   ],\n   \"다 캔 칸의 숫자는 그 칸을 둘러싼 여덟 칸에 묻힌 내 조각 수야. 블록 위의 숫자는 남은 흙의 층수고. 숫자 칸을 누르면 둘레가 빛나고, 조각 수만큼 소리와 진동으로 두드려 줄게.\": [\n    \"p01.mp3\",\n    91.076,\n    104.296\n   ],\n   \"점(·)은 0이라는 뜻이야. 이 칸을 둘러싼 여덟 칸에는 내 조각이 없어. 숫자 칸을 누르면 언제든 둘레를 다시 비춰 줄게.\": [\n    \"p02.mp3\",\n    0.346,\n    9.166\n   ],\n   \"방금 드러난 숫자 보여? 이 칸을 둘러싼 여덟 칸에 내 조각이 1개 묻혀 있다는 뜻이야. 숫자 칸을 누르면 언제든 둘레를 다시 비춰 줄게.\": [\n    \"p02.mp3\",\n    9.666,\n    21.266\n   ],\n   \"방금 드러난 숫자 보여? 이 칸을 둘러싼 여덟 칸에 내 조각이 2개 묻혀 있다는 뜻이야. 숫자 칸을 누르면 언제든 둘레를 다시 비춰 줄게.\": [\n    \"p02.mp3\",\n    21.766,\n    33.146\n   ],\n   \"방금 드러난 숫자 보여? 이 칸을 둘러싼 여덟 칸에 내 조각이 3개 묻혀 있다는 뜻이야. 숫자 칸을 누르면 언제든 둘레를 다시 비춰 줄게.\": [\n    \"p02.mp3\",\n    33.646,\n    44.726\n   ],\n   \"방금 드러난 숫자 보여? 이 칸을 둘러싼 여덟 칸에 내 조각이 4개 묻혀 있다는 뜻이야. 숫자 칸을 누르면 언제든 둘레를 다시 비춰 줄게.\": [\n    \"p02.mp3\",\n    45.226,\n    56.286\n   ],\n   \"방금 드러난 숫자 보여? 이 칸을 둘러싼 여덟 칸에 내 조각이 5개 묻혀 있다는 뜻이야. 숫자 칸을 누르면 언제든 둘레를 다시 비춰 줄게.\": [\n    \"p02.mp3\",\n    56.786,\n    68.376\n   ],\n   \"잠깐 숨 고르자. 서두르지 않아도 괜찮아. 다시 천천히 찾아보자.\": [\n    \"p02.mp3\",\n    68.876,\n    74.086\n   ],\n   \"낮은 관 조각을 찾았어. 바로 답을 보지 말고 조사대에서 직접 살펴봐 줘.\": [\n    \"p02.mp3\",\n    74.586,\n    80.046\n   ],\n   \"얼굴 조각을 찾았어. 바로 답을 보지 말고 조사대에서 직접 살펴봐 줘.\": [\n    \"p02.mp3\",\n    80.546,\n    85.856\n   ],\n   \"뺨 가까이의 손 조각을 찾았어. 바로 답을 보지 말고 조사대에서 직접 살펴봐 줘.\": [\n    \"p02.mp3\",\n    86.356,\n    92.726\n   ],\n   \"옷주름 조각을 찾았어. 바로 답을 보지 말고 조사대에서 직접 살펴봐 줘.\": [\n    \"p02.mp3\",\n    93.226,\n    98.656\n   ],\n   \"반가 자세의 다리 조각을 찾았어. 바로 답을 보지 말고 조사대에서 직접 살펴봐 줘.\": [\n    \"p03.mp3\",\n    0.346,\n    6.576\n   ],\n   \"내 모습을 제대로 봐 줘서 되찾았어. 고마워.\": [\n    \"p03.mp3\",\n    7.076,\n    10.726\n   ],\n   \"머리 위에 완만한 봉우리 세 개가 나란히 솟아 있다. 금속 표면에 가는 끌 자국이 남아 있다.\": [\n    \"p03.mp3\",\n    11.226,\n    18.016\n   ],\n   \"둥근 산 세 개 모양의 낮은 관이라 삼산관이라 부릅니다. 참고로 국보 78호 반가사유상은 해와 달 장식이 있는 일월식 보관을 썼습니다. 관의 모양이 두 국보를 구별하는 기준이 됩니다.\": [\n    \"p03.mp3\",\n    18.516,\n    32.096\n   ],\n   \"관 안쪽이 비어 있다. 빈 공간이 목을 지나 몸통까지 하나로 이어진다.\": [\n    \"p03.mp3\",\n    32.596,\n    37.926\n   ],\n   \"속틀(내형토)에 밀랍을 입혀 모양을 만들고 그 위를 거푸집으로 감싼 뒤 금속을 부었습니다. 틀을 빼내면 속이 빈 상태가 됩니다. 이를 중공식 주조라 합니다. 국보 83호는 머리와 몸체의 속틀을 하나로 만든 것이 특징입니다.\": [\n    \"p03.mp3\",\n    38.426,\n    56.176\n   ],\n   \"구리 신호가 가장 강하고 주석이 함께 검출된다. 금은 표면에서만 읽힌다.\": [\n    \"p03.mp3\",\n    56.676,\n    62.776\n   ],\n   \"금동은 구리 합금으로 주조한 뒤 표면에 금을 입힌 것입니다. 금이 표면에서만 검출되는 것이 바로 도금의 증거입니다. 속까지 금이라면 순금이겠지요.\": [\n    \"p03.mp3\",\n    63.276,\n    75.756\n   ],\n   \"낮은 관 조각을 완전히 알아봤어. 이 조각 이야기, 들어 줄래?\": [\n    \"p03.mp3\",\n    76.256,\n    81.396\n   ],\n   \"눈은 가늘게 감긴 선으로 표현되고, 입꼬리가 아주 조금 올라가 있다. 이마와 뺨은 매끄럽게 이어진다.\": [\n    \"p03.mp3\",\n    81.896,\n    90.216\n   ],\n   \"눈을 완전히 감지도 뜨지도 않은 반개(半開)와 입가의 옅은 미소를 함께 써서 생각에 잠긴 상태를 표현합니다. 웃음을 크게 드러내지 않는 것이 이 미소의 핵심입니다.\": [\n    \"p03.mp3\",\n    90.716,\n    103.306\n   ],\n   \"머리 속 빈 공간이 목을 지나 몸통까지 끊김 없이 연결된다. 이음선이 보이지 않는다.\": [\n    \"p04.mp3\",\n    0.346,\n    7.436\n   ],\n   \"국립중앙박물관 조사에서 국보 83호는 머리와 몸체의 속틀을 하나로 만든 것이 확인되었습니다. 반면 국보 78호는 머리와 몸체를 따로 만들어 이은 흔적이 있습니다. 감마선 촬영으로 깨지 않고 이런 차이를 읽을 수 있습니다.\": [\n    \"p04.mp3\",\n    7.936,\n    24.846\n   ],\n   \"얼굴 대부분은 성분이 균일하지만, 뺨 아래 한 부분만 합금 비율이 다르게 나온다.\": [\n    \"p04.mp3\",\n    25.346,\n    31.136\n   ],\n   \"국보 83호는 주조 과정에서 결함이 많이 생겨, 재주조하거나 부분을 따로 주조해 끼우는 방식으로 수리한 흔적이 확인되었습니다. 1400년 전의 수리 기록이 성분 차이로 남아 있는 셈입니다.\": [\n    \"p04.mp3\",\n    31.636,\n    45.576\n   ],\n   \"얼굴 조각을 완전히 알아봤어. 이 조각 이야기, 들어 줄래?\": [\n    \"p04.mp3\",\n    46.076,\n    50.426\n   ],\n   \"검지와 중지가 펴져 뺨 쪽을 향한다. 손끝과 뺨 사이에 아주 좁은 틈이 남아 있다.\": [\n    \"p04.mp3\",\n    50.926,\n    57.766\n   ],\n   \"손끝이 뺨을 누르지 않고 아주 좁은 틈을 남긴 채 멈춰 있습니다. 로댕의 생각하는 사람이 주먹으로 턱을 받쳐 긴장을 드러내는 것과 정반대로, 이 상은 힘을 뺀 상태로 사유를 표현합니다.\": [\n    \"p04.mp3\",\n    58.266,\n    72.786\n   ],\n   \"팔 내부에서 금속 막대 같은 심이 몇 개 관찰된다. 주변 금속과 밀도가 다르다.\": [\n    \"p04.mp3\",\n    73.286,\n    79.956\n   ],\n   \"속틀이 거푸집 안에서 움직이면 두께가 한쪽으로 쏠려 주조가 실패합니다. 그래서 쇠못으로 속틀을 고정했고, 국보 78호와 83호 모두에서 이 쇠못이 확인되었습니다.\": [\n    \"p04.mp3\",\n    80.456,\n    92.916\n   ],\n   \"구리에 주석이 섞인 비율이 비교적 높게 나온다.\": [\n    \"p04.mp3\",\n    93.416,\n    96.806\n   ],\n   \"구리만으로는 녹는 점이 높고 잘 흐르지 않습니다. 주석을 섞으면 쇳물이 가는 틈까지 잘 흘러 들어가고 굳은 뒤에도 단단합니다. 손가락처럼 얇고 섬세한 부분을 뜨려면 이 성질이 반드시 필요합니다.\": [\n    \"p05.mp3\",\n    0.346,\n    15.626\n   ],\n   \"뺨 가까이의 손 조각을 완전히 알아봤어. 이 조각 이야기, 들어 줄래?\": [\n    \"p05.mp3\",\n    16.126,\n    21.676\n   ],\n   \"주름이 날카롭게 꺾이지 않고 길게 이어지는 곡선을 그린다. 선의 깊이가 일정하지 않다.\": [\n    \"p05.mp3\",\n    22.176,\n    29.076\n   ],\n   \"주름을 날카롭게 꺾지 않고 길게 흐르게 해서 힘을 뺀 상체를 표현했습니다. 옷주름은 장식이 아니라 몸의 상태를 보여 주는 장치입니다.\": [\n    \"p05.mp3\",\n    29.576,\n    39.836\n   ],\n   \"주름이 깊은 자리의 금속이 유독 얇고, 작은 빈 구멍이 여러 개 보인다.\": [\n    \"p05.mp3\",\n    40.336,\n    45.636\n   ],\n   \"밀랍을 두껍게 입힌 뒤 깎아 조각하면 섬세한 표현은 가능하지만 금속이 흐를 틈이 좁아집니다. 국보 83호에서 주조 결함이 많이 나타난 이유로 이 방식이 지적되었습니다. 결함은 실력 부족이 아니라 선택한 공법의 대가입니다.\": [\n    \"p05.mp3\",\n    46.136,\n    63.126\n   ],\n   \"표면의 금 신호가 주름의 깊은 골짜기에서 약하게 나온다.\": [\n    \"p05.mp3\",\n    63.626,\n    67.956\n   ],\n   \"도금은 표면 작업이라 깊고 좁은 골짜기까지 고르게 입히기 어렵습니다. 1400년 동안 닳은 정도도 자리마다 달라서, 금이 남은 분포만으로도 손이 자주 닿았던 부위를 추정할 수 있습니다.\": [\n    \"p05.mp3\",\n    68.456,\n    81.996\n   ],\n   \"옷주름 조각을 완전히 알아봤어. 이 조각 이야기, 들어 줄래?\": [\n    \"p05.mp3\",\n    82.496,\n    87.646\n   ],\n   \"한쪽 다리는 접혀 다른 무릎 위에 올라가 있고, 다른 다리는 아래로 내려 발바닥이 받침에 닿는다.\": [\n    \"p05.mp3\",\n    88.146,\n    95.176\n   ],\n   \"두 다리를 모두 교차하는 결가부좌가 아니라 한쪽만 올린 반가부좌입니다. 반가사유상이라는 이름의 반가가 바로 이 자세를 뜻합니다. 한 다리를 내려 둔 덕분에 곧 일어설 수도 있는, 멈춘 듯 움직이는 상태가 됩니다.\": [\n    \"p06.mp3\",\n    0.346,\n    16.456\n   ],\n   \"다리와 받침이 만나는 자리에 금속 밀도가 다른 경계면이 보인다.\": [\n    \"p06.mp3\",\n    16.956,\n    21.506\n   ],\n   \"큰 상은 한 번에 다 뜨기 어렵기 때문에 부분을 나누어 주조한 뒤 결합합니다. 국보 78호와 83호 모두 밀랍 틀을 만드는 과정에서 분할주조법을 쓴 것으로 확인되었습니다.\": [\n    \"p06.mp3\",\n    22.006,\n    33.966\n   ],\n   \"받침 부분의 합금 비율이 몸체와 미세하게 다르다.\": [\n    \"p06.mp3\",\n    34.466,\n    37.986\n   ],\n   \"무게를 받쳐야 하는 받침은 단단함이, 얇게 흘러야 하는 세부는 유동성이 중요합니다. 부위마다 요구가 다르면 합금 비율도 달라집니다. 성분 분석이 제작 순서를 복원하는 단서가 되는 이유입니다.\": [\n    \"p06.mp3\",\n    38.486,\n    52.696\n   ],\n   \"반가 자세의 다리 조각을 완전히 알아봤어. 이 조각 이야기, 들어 줄래?\": [\n    \"p06.mp3\",\n    53.196,\n    58.416\n   ],\n   \"조금 달라. 판독 결과를 한 번 더 읽어 봐.\": [\n    \"p06.mp3\",\n    58.916,\n    62.246\n   ],\n   \"내 머리의 관을 봤구나. 봉우리가 세 개인 그 관, 어떤 느낌이었어?\": [\n    \"p06.mp3\",\n    62.746,\n    68.726\n   ],\n   \"맞아. 높고 화려한 관이 아니라 낮은 산이야. 위엄보다 고요를 택한 거지. 78호 쪽은 해와 달을 얹었다는데, 나는 산이 좋아.\": [\n    \"p06.mp3\",\n    69.226,\n    80.746\n   ],\n   \"그렇지? 장식을 덜어낸 거야. 시선이 관이 아니라 내 얼굴과 손으로 가도록.\": [\n    \"p06.mp3\",\n    81.246,\n    87.566\n   ],\n   \"괜찮아. 다음에 볼 때는 봉우리 세 개의 높이를 비교해 봐. 가운데가 조금 더 높아.\": [\n    \"p06.mp3\",\n    88.066,\n    93.956\n   ],\n   \"내 얼굴은… 어땠어? 똑바로 봤다면 알 텐데.\": [\n    \"p06.mp3\",\n    94.456,\n    98.846\n   ],\n   \"그걸 봤구나. 완전히 감으면 잠든 거고, 다 뜨면 밖을 보는 거야. 그 중간이라서 생각하는 중인 거지.\": [\n    \"p07.mp3\",\n    0.346,\n    8.086\n   ],\n   \"크게 웃으면 기쁨이 되어 버려. 겨우 올라간 입꼬리라서 아직 생각 속에 있는 거야.\": [\n    \"p07.mp3\",\n    8.586,\n    14.399\n   ],\n   \"어려운 게 당연해. 1400년 동안 아무도 정답을 못 냈어. 다음엔 입꼬리만 따로 봐 줘.\": [\n    \"p07.mp3\",\n    14.899,\n    21.849\n   ],\n   \"내 손끝. 뺨에 닿았다고 생각했어, 아니면 떨어져 있었어?\": [\n    \"p07.mp3\",\n    22.349,\n    26.589\n   ],\n   \"느꼈어? 거의 느껴지지 않을 만큼 작은 떨림. 그 틈에서 나는 생각해.\": [\n    \"p07.mp3\",\n    27.089,\n    32.799\n   ],\n   \"봤구나. 그 틈이 전부야. 누르면 괴로움이 되고, 떼면 무관심이 돼. 닿을 듯 멈춘 그 자리가 사유야.\": [\n    \"p07.mp3\",\n    33.299,\n    41.499\n   ],\n   \"그 사람은 주먹으로 턱을 받치고 온몸에 힘을 주지. 나는 반대야. 힘을 빼고 생각해. 같은 주제를 정반대로 표현한 거야.\": [\n    \"p07.mp3\",\n    41.999,\n    51.099\n   ],\n   \"다들 그렇게 봐. 다음에 확대해서 손끝과 뺨 사이를 봐 줘. 거기 빛이 지나가.\": [\n    \"p07.mp3\",\n    51.599,\n    57.979\n   ],\n   \"옷주름은 그냥 장식처럼 보였어?\": [\n    \"p07.mp3\",\n    58.479,\n    60.869\n   ],\n   \"정확해. 주름은 천을 그린 게 아니라 몸의 상태를 그린 거야. 긴장하면 주름이 꺾이고, 풀리면 흐르지.\": [\n    \"p07.mp3\",\n    61.369,\n    68.929\n   ],\n   \"그 흐름을 만들려고 밀랍을 두껍게 입히고 깎아냈어. 그 대가로 결함이 생겼지만… 나는 그 선택이 좋아.\": [\n    \"p07.mp3\",\n    69.429,\n    76.999\n   ],\n   \"제일 지나치기 쉬운 데야. 다음엔 상체에서 다리로 내려가는 가장 긴 선 하나만 눈으로 따라와 줘.\": [\n    \"p07.mp3\",\n    77.499,\n    84.529\n   ],\n   \"내 다리 자세, 어떻게 봤어?\": [\n    \"p07.mp3\",\n    85.029,\n    87.729\n   ],\n   \"그게 핵심이야. 두 다리를 다 접으면 완전히 멈춘 거야. 한 다리를 내려 둔 건 아직 끝나지 않은 생각이라는 뜻이지.\": [\n    \"p07.mp3\",\n    88.229,\n    97.949\n   ],\n   \"팔꿈치와 올린 무릎, 내려딛은 발. 그 세 점이 서로 받쳐 줘. 좌우가 같지 않아도 균형은 만들어지는 거야.\": [\n    \"p08.mp3\",\n    0.346,\n    9.226\n   ],\n   \"그래도 괜찮아. 다음엔 두 무릎의 높이만 비교해 봐. 그 차이가 이름이 됐어.\": [\n    \"p08.mp3\",\n    9.726,\n    16.866\n   ],\n   \"복원상의 가장 위쪽, 머리 바로 위를 다시 살펴보세요.\": [\n    \"p08.mp3\",\n    17.366,\n    21.276\n   ],\n   \"좋아. 낮은 관 조각의 자리를 찾았어.\": [\n    \"p08.mp3\",\n    21.776,\n    24.846\n   ],\n   \"관 아래의 얼굴과 눈, 입가의 관계를 다시 관찰해보세요.\": [\n    \"p08.mp3\",\n    25.346,\n    29.896\n   ],\n   \"좋아. 얼굴 조각의 자리를 찾았어.\": [\n    \"p08.mp3\",\n    30.396,\n    33.066\n   ],\n   \"얼굴 옆에 올라온 팔과 손끝의 위치를 다시 살펴보세요.\": [\n    \"p08.mp3\",\n    33.566,\n    37.716\n   ],\n   \"좋아. 뺨 가까이의 손 조각의 자리를 찾았어.\": [\n    \"p08.mp3\",\n    38.216,\n    41.696\n   ],\n   \"상체 아래에서 다리 쪽으로 흐르는 긴 선을 찾아보세요.\": [\n    \"p08.mp3\",\n    42.196,\n    46.276\n   ],\n   \"좋아. 옷주름 조각의 자리를 찾았어.\": [\n    \"p08.mp3\",\n    46.776,\n    49.576\n   ],\n   \"몸의 아래쪽에서 올라간 다리와 내려온 다리의 높이를 비교해보세요.\": [\n    \"p08.mp3\",\n    50.076,\n    54.776\n   ],\n   \"좋아. 반가 자세의 다리 조각의 자리를 찾았어.\": [\n    \"p08.mp3\",\n    55.276,\n    58.526\n   ],\n   \"머리부터 어깨까지 한 호흡으로 이어 주는 거네. 내 목선이 자연스러운 이유가 여기 있었구나.\": [\n    \"p08.mp3\",\n    59.026,\n    66.366\n   ],\n   \"안전한 길이야. 나와는 다른 방식이지만, 78호 쪽은 그렇게 만들어졌다고 하더라.\": [\n    \"p08.mp3\",\n    66.866,\n    73.356\n   ],\n   \"실패는 적겠지만… 내 옷주름이 조금 단순해질 것 같아.\": [\n    \"p08.mp3\",\n    73.856,\n    79.056\n   ],\n   \"내 손끝과 뺨 사이의 그 좁은 틈을 만들려면 이 방법밖에 없어. 결함이 생겨도… 그 선택이었으면 좋겠어.\": [\n    \"p08.mp3\",\n    79.556,\n    87.996\n   ],\n   \"깔끔한 건 좋지만… 흔들리면 다 틀어져 버려.\": [\n    \"p08.mp3\",\n    88.496,\n    92.146\n   ],\n   \"무리하지 않는 선택이네. 나도 그 정도가 좋아.\": [\n    \"p08.mp3\",\n    92.646,\n    95.856\n   ],\n   \"단단하긴 할 거야. 다만 내 몸에 자국이 좀 남겠지.\": [\n    \"p08.mp3\",\n    96.356,\n    100.746\n   ],\n   \"적정 온도에서 정확히 멈췄습니다. 쇳물이 거푸집 끝까지 고르게 찼습니다.\": [\n    \"p09.mp3\",\n    0.346,\n    6.236\n   ],\n   \"적정 구간을 살짝 벗어났습니다. 대부분은 찼지만 끝부분이 아쉽습니다.\": [\n    \"p09.mp3\",\n    6.736,\n    12.076\n   ],\n   \"쇳물이 식은 뒤에 멈췄습니다. 좁은 틈까지 흐르지 못했습니다.\": [\n    \"p09.mp3\",\n    12.576,\n    17.396\n   ],\n   \"너무 뜨거운 상태로 오래 부었습니다. 거푸집 일부가 상했습니다.\": [\n    \"p09.mp3\",\n    17.896,\n    22.586\n   ],\n   \"결함이 1곳 생겼어. 수리할 수 있어.\": [\n    \"p09.mp3\",\n    23.086,\n    25.896\n   ],\n   \"결함이 2곳 생겼어. 수리할 수 있어.\": [\n    \"p09.mp3\",\n    26.396,\n    29.316\n   ],\n   \"결함이 3곳 생겼어. 수리할 수 있어.\": [\n    \"p09.mp3\",\n    29.816,\n    32.546\n   ],\n   \"결함이 4곳 생겼어. 수리할 수 있어.\": [\n    \"p09.mp3\",\n    33.046,\n    35.806\n   ],\n   \"결함이 5곳 생겼어. 수리할 수 있어.\": [\n    \"p09.mp3\",\n    36.306,\n    39.136\n   ],\n   \"결함이 6곳 생겼어. 수리할 수 있어.\": [\n    \"p09.mp3\",\n    39.636,\n    42.406\n   ],\n   \"결함이 7곳 생겼어. 수리할 수 있어.\": [\n    \"p09.mp3\",\n    42.906,\n    45.866\n   ],\n   \"결함이 8곳 생겼어. 수리할 수 있어.\": [\n    \"p09.mp3\",\n    46.366,\n    49.226\n   ],\n   \"결함이 9곳 생겼어. 수리할 수 있어.\": [\n    \"p09.mp3\",\n    49.726,\n    52.606\n   ],\n   \"결함이 10곳 생겼어. 수리할 수 있어.\": [\n    \"p09.mp3\",\n    53.106,\n    55.946\n   ],\n   \"결함이 심한 부분은 다시 녹여 주조했습니다. 많은 결함을 한 번에 없앨 수 있지만 원래 조형이 그만큼 달라집니다.\": [\n    \"p09.mp3\",\n    56.446,\n    64.316\n   ],\n   \"국보 83호에서는 부분을 따로 주조해 끼운 흔적이 확인되었습니다. 그래서 그 부위만 합금 비율이 다르게 나타납니다. XRF 분석으로 읽어 낸 바로 그 차이입니다.\": [\n    \"p09.mp3\",\n    64.816,\n    76.296\n   ],\n   \"결함을 남긴 채 완성한 부분도 있습니다. 1400년 뒤 감마선 촬영이 그 흔적을 찾아내 당시의 공정을 알려 주었습니다. 흠이 기록이 된 셈입니다. 다만 남은 결함이 많으면 제 모습을 갖추지 못합니다.\": [\n    \"p09.mp3\",\n    76.796,\n    91.106\n   ],\n   \"이렇게 깨끗하게 나온 적이 있었을까. 당신 손끝이 내 손끝을 제대로 이해한 것 같아.\": [\n    \"p09.mp3\",\n    91.606,\n    97.716\n   ],\n   \"나도 그랬어. 흠 없이 태어난 게 아니라, 고쳐 가면서 남은 거야. 그게 더 나다운 것 같아.\": [\n    \"p09.mp3\",\n    98.216,\n    104.386\n   ],\n   \"흠은 없는데… 얼굴선이 조금 흐려졌네. 흐름과 섬세함을 함께 잡기는 정말 어려워.\": [\n    \"p10.mp3\",\n    0.346,\n    7.116\n   ],\n   \"괜찮아. 1400년 전 장인들도 여러 번 실패했어. 어느 공정에서 막혔는지 같이 보자.\": [\n    \"p10.mp3\",\n    7.616,\n    14.076\n   ],\n   \"오늘 나를 처음부터 끝까지 봐 줘서 고마워.\": [\n    \"p10.mp3\",\n    14.576,\n    17.436\n   ]\n  }\n }\n}\n"};
  const realFetch = window.fetch ? window.fetch.bind(window) : null;
  window.fetch = (input, init) => {
    const url = typeof input === "string" ? input : input.url;
    const path = new URL(url, location.href).pathname;
    for (const key in files) {
      if (path.endsWith("/" + key)) {
        return Promise.resolve(new Response(files[key], { headers: { "Content-Type": "application/json" } }));
      }
    }
    return realFetch ? realFetch(input, init) : Promise.reject(new TypeError("fetch unavailable"));
  };
})();
