? 다시 생각해 봐.\"\n  },\n  \"dig\": {\n    \"guide\": \"여기부터 살살 쓸어 볼래? 빛나는 블록 근처에 내 조각이 있는 것 같아.\",\n    \"clue\": \"방금 드러난 숫자 보여? 이 칸을 둘러싼 여덟 칸에 내 조각이 {n}개 묻혀 있다는 뜻이야. 숫자 칸을 누르면 언제든 둘레를 다시 비춰 줄게.\",\n    \"clueZero\": \"점(·)은 0이라는 뜻이야. 이 칸을 둘러싼 여덟 칸에는 내 조각이 없어. 숫자 칸을 누르면 언제든 둘레를 다시 비춰 줄게.\",\n    \"rule\": \"다 캔 칸의 숫자는 그 칸을 둘러싼 여덟 칸에 묻힌 내 조각 수야. 블록 위의 숫자는 남은 흙의 층수고. 숫자 칸을 누르면 둘레가 빛나고, 조각 수만큼 소리와 진동으로 두드려 줄게.\",\n    \"noFocusStudy\": \"집중력이 바닥났어요. 조사대에서 조각을 감별하면 3씩 돌아옵니다.\",\n    \"stuck\": \"집중력이 바닥났고 감별할 조각도 남지 않았어요. 사유와 잠시 쉬어 가면 집중력이 돌아옵니다.\",\n    \"restButton\": \"사유와 잠시 쉬어 가기 · 집중력 +6\",\n    \"rest\": \"잠깐 숨 고르자. 서두르지 않아도 괜찮아. 다시 천천히 찾아보자.\",\n    \"restAmount\": 6,\n    \"stages\": [\n      { \"name\": \"안내\", \"desc\": \"사유가 쓸어 볼 블록을 빛으로 짚어 줍니다.\" },\n      { \"name\": \"힌트\", \"desc\": \"손끝으로 블록 위를 끌거나 방향키로 옮기면, 묻힌 조각 가까이에서 두근거리는 소리·진동이 납니다.\" },\n      { \"name\": \"자율\", \"desc\": \"도움 없이 숫자와 소리만 읽고 스스로 고릅니다.\" }\n    ]\n  },\n  \"hub\": {\n    \"title\": \"발굴 캠프\",\n    \"lead\": \"원하는 순서로 오갈 수 있습니다. 같은 조각을 다시 보러 가도 좋습니다.\",\n    \"lines\": {\n      \"start\": \"어디부터 갈까? 서두르지 않아도 괜찮아.\",\n      \"digging\": \"아직 흙 속에 내 조각이 남아 있어.\",\n      \"studyPending\": \"찾아 준 조각, 아직 제대로 들여다보지 않았어. 조사대에서 기다릴게.\",\n      \"castReady\": \"조각을 다 알아봤구나. 이제… 나를 처음부터 만들어 볼래?\",\n      \"done\": \"오늘 당신이 해 준 일을 전부 기억할 거야.\"\n    }\n  },\n  \"unlocked\": {\n    \"crown\": {\n      \"prompt\": \"내 머리의 관을 봤구나. 봉우리가 세 개인 그 관, 어떤 느낌이었어?\",\n      \"options\": [\n        { \"id\": \"mountain\", \"label\": \"먼 산을 세 개 얹은 것처럼 조용했어.\", \"gain\": 5, \"response\": \"맞아. 높고 화려한 관이 아니라 낮은 산이야. 위엄보다 고요를 택한 거지. 78호 쪽은 해와 달을 얹었다는데, 나는 산이 좋아.\" },\n        { \"id\": \"simple\", \"label\": \"생각보다 단순해서 놀랐어.\", \"gain\": 4, \"response\": \"그렇지? 장식을 덜어낸 거야. 시선이 관이 아니라 내 얼굴과 손으로 가도록.\" },\n        { \"id\": \"unsure\", \"label\": \"솔직히 아직 잘 모르겠어.\", \"gain\": 3, \"response\": \"괜찮아. 다음에 볼 때는 봉우리 세 개의 높이를 비교해 봐. 가운데가 조금 더 높아.\" }\n      ]\n    },\n    \"face\": {\n      \"prompt\": \"내 얼굴은… 어땠어? 똑바로 봤다면 알 텐데.\",\n      \"options\": [\n        { \"id\": \"halfopen\", \"label\": \"눈을 다 감지도, 뜨지도 않았더라.\", \"gain\": 5, \"response\": \"그걸 봤구나. 완전히 감으면 잠든 거고, 다 뜨면 밖을 보는 거야. 그 중간이라서 생각하는 중인 거지.\" },\n        { \"id\": \"smile\", \"label\": \"미소가 아주 옅었어.\", \"gain\": 4, \"response\": \"크게 웃으면 기쁨이 되어 버려. 겨우 올라간 입꼬리라서 아직 생각 속에 있는 거야.\" },\n        { \"id\": \"unsure\", \"label\": \"표정을 읽기가 어려웠어.\", \"gain\": 3, \"response\": \"어려운 게 당연해. 1400년 동안 아무도 정답을 못 냈어. 다음엔 입꼬리만 따로 봐 줘.\" }\n      ]\n    },\n    \"hand\": {\n      \"prompt\": \"내 손끝. 뺨에 닿았다고 생각했어, 아니면 떨어져 있었어?\",\n      \"embodied\": {\n        \"cue\": \"대답하기 전에 직접 해 보세요. 오른손 검지를 뺨 가까이 가져가, 닿기 직전에서 멈춰 보세요.\",\n        \"button\": \"닿을 듯 말 듯 느껴 보기\",\n        \"after\": \"느꼈어? 거의 느껴지지 않을 만큼 작은 떨림. 그 틈에서 나는 생각해.\"\n      },\n      \"options\": [\n        { \"id\": \"gap\", \"label\": \"닿지 않았어. 아주 좁은 틈이 있었어.\", \"gain\": 5, \"response\": \"봤구나. 그 틈이 전부야. 누르면 괴로움이 되고, 떼면 무관심이 돼. 닿을 듯 멈춘 그 자리가 사유야.\" },\n        { \"id\": \"rodin\", \"label\": \"로댕의 생각하는 사람과는 달랐어.\", \"gain\": 5, \"response\": \"그 사람은 주먹으로 턱을 받치고 온몸에 힘을 주지. 나는 반대야. 힘을 빼고 생각해. 같은 주제를 정반대로 표현한 거야.\" },\n        { \"id\": \"unsure\", \"label\": \"닿은 줄 알았어.\", \"gain\": 3, \"response\": \"다들 그렇게 봐. 다음에 확대해서 손끝과 뺨 사이를 봐 줘. 거기 빛이 지나가.\" }\n      ]\n    },\n    \"robe\": {\n      \"prompt\": \"옷주름은 그냥 장식처럼 보였어?\",\n      \"options\": [\n        { \"id\": \"body\", \"label\": \"아니. 몸이 힘을 뺀 상태가 옷으로 보였어.\", \"gain\": 5, \"response\": \"정확해. 주름은 천을 그린 게 아니라 몸의 상태를 그린 거야. 긴장하면 주름이 꺾이고, 풀리면 흐르지.\" },\n        { \"id\": \"flow\", \"label\": \"선이 끊기지 않고 길게 흘렀어.\", \"gain\": 4, \"response\": \"그 흐름을 만들려고 밀랍을 두껍게 입히고 깎아냈어. 그 대가로 결함이 생겼지만… 나는 그 선택이 좋아.\" },\n        { \"id\": \"unsure\", \"label\": \"주름까진 신경 못 썼어.\", \"gain\": 3, \"response\": \"제일 지나치기 쉬운 데야. 다음엔 상체에서 다리로 내려가는 가장 긴 선 하나만 눈으로 따라와 줘.\" }\n      ]\n    },\n    \"leg\": {\n      \"prompt\": \"내 다리 자세, 어떻게 봤어?\",\n      \"options\": [\n        { \"id\": \"half\", \"label\": \"한쪽만 올린 반가부좌였어. 곧 일어설 수도 있을 것 같았어.\", \"gain\": 5, \"response\": \"그게 핵심이야. 두 다리를 다 접으면 완전히 멈춘 거야. 한 다리를 내려 둔 건 아직 끝나지 않은 생각이라는 뜻이지.\" },\n        { \"id\": \"balance\", \"label\": \"비대칭인데 안정적으로 보여서 신기했어.\", \"gain\": 5, \"response\": \"팔꿈치와 올린 무릎, 내려딛은 발. 그 세 점이 서로 받쳐 줘. 좌우가 같지 않아도 균형은 만들어지는 거야.\" },\n        { \"id\": \"unsure\", \"label\": \"그냥 앉아 있는 걸로 봤어.\", \"gain\": 3, \"response\": \"그래도 괜찮아. 다음엔 두 무릎의 높이만 비교해 봐. 그 차이가 이름이 됐어.\" }\n      ]\n    }\n  },\n  \"tiers\": [\n    { \"min\": 0, \"mood\": \"낯섦\", \"line\": \"아직 서로 모르는 게 많네.\" },\n    { \"min\": 25, \"mood\": \"관심\", \"line\": \"당신이 들여다볼 때마다 조금씩 선명해지는 기분이야.\" },\n    { \"min\": 50, \"mood\": \"신뢰\", \"line\": \"이제 내 얘기를 조금 더 해도 될까?\" },\n    { \"min\": 75, \"mood\": \"애정\", \"line\": \"당신이 보는 나라면, 1400년을 더 기다려도 괜찮아.\" }\n  ],\n  \"completion\": \"당신이 다시 바라본 관, 얼굴, 손, 옷주름, 다리가 하나의 사유하는 자세로 이어졌어.\",\n  \"endings\": {\n    \"true\": {\n      \"kind\": \"love\",\n      \"badge\": \"TRUE ENDING\",\n      \"title\": \"끝까지 바라봐 준 사람\",\n      \"text\": \"도감을 모두 채우고, 주조까지 완성했습니다. 조각이 아니라 관계를 복원했습니다.\",\n      \"line\": \"이제 알 것 같아. 내가 기다린 건 조각이 아니라, 나를 오래 바라봐 줄 당신이었나 봐.\"\n    },\n    \"good\": {\n      \"kind\": \"friend\",\n      \"badge\": \"GOOD ENDING\",\n      \"title\": \"다시 만나고 싶은 동료\",\n      \"text\": \"관찰과 제작을 거치며 사유와 신뢰를 쌓았습니다.\",\n      \"line\": \"오늘 찾은 기억을 잊지 말아줘. 다음에도 당신과 함께 발굴하고 싶어.\"\n    },\n    \"normal\": {\n      \"kind\": \"memory\",\n      \"badge\": \"NORMAL ENDING\",\n      \"title\": \"복원된 첫 번째 기억\",\n      \"text\": \"사유의 모습을 되찾았고, 더 깊은 관계로 이어질 단서를 남겼습니다.\",\n      \"line\": \"아직 서로 모르는 게 많네. 그래도 오늘 나를 찾아줘서 고마워.\"\n    }\n  }\n}\n", "data/casting.json": "{\n  \"intro\": {\n    \"title\": \"밀랍주조 공방\",\n    \"lead\": \"국립중앙박물관 조사에 따르면 반가사유상은 밀랍법으로 주조되었습니다. 네 공정을 직접 선택해 보세요. 어떤 선택에도 정답과 대가가 함께 있습니다.\",\n    \"meters\": [\n      {\n        \"id\": \"detail\",\n        \"name\": \"조형 섬세도\",\n        \"desc\": \"얼마나 세밀하게 표현할 수 있는가\"\n      },\n      {\n        \"id\": \"flow\",\n        \"name\": \"쇳물 유동성\",\n        \ 깊은 주름이나 섬세한 손가락 표현이 어려워집니다.\",\n          \"sayu\": \"실패는 적겠지만… 내 옷주름이 조금 단순해질 것 같아.\"\n        },\n        {\n          \"id\": \"thick\",\n          \"label\": \"두껍게 입힌 뒤 깎아내며 조각한다\",\n          \"sub\": \"국보 83호가 쓴 방식\",\n          \"effects\": {\n            \"detail\": 25,\n            \"flow\": -25,\n            \"stability\": 0\n          },\n          \"fact\": \"국보 83호는 밀랍을 두껍게 입힌 뒤 깎아내 조각했습니다. 조각가의 손이 자유로워 표현은 섬세해지지만, 주조할 때 쇳물의 유동성이 떨어져 결함이 많이 생겼습니다. 결함은 실력 부족이 아니라 이 공법을 택한 대가입니다.\",\n          \"sayu\": \"내 손끝과 뺨 사이의 그 좁은 틈을 만들려면 이 방법밖에 없어. 결함이 생겨도… 그 선택이었으면 좋겠어.\"\n        }\n      ]\n    },\n    {\n      \"id\": \"pins\",\n      \"step\": 3,\n      \"name\": \"쇠못 박기\",\n      \"prompt\": \"거푸집 안에서 속틀이 움직이지 않도록 쇠못으로 고정합니다. 몇 개를 쓸까요?\",\n      \"note\": \"속틀이 한쪽으로 쏠리면 금속 두께가 치우쳐 주조가 실패합니다.\",\n      \"options\": [\n        {\n          \"id\": \"few\",\n          \"label\": \"2개만 — 흔적을 최소화한다\",\n          \"sub\": \"표면은 깨끗하지만 위험\",\n          \"effects\": {\n            \"detail\": 5,\n            \"flow\": 0,\n            \"stability\": -20\n          },\n          \"fact\": \"쇠못을 적게 쓰면 완성품에 남는 못 자리가 줄어듭니다. 그러나 속틀이 흔들리면 한쪽 금속이 지나치게 얇아져 구멍이 뚫립니다.\",\n          \"sayu\": \"깔끔한 건 좋지만… 흔들리면 다 틀어져 버려.\"\n        },\n        {\n          \"id\": \"balanced\",\n          \"label\": \"4개 — 균형을 맞춘다\",\n          \"sub\": \"무난한 선택\",\n          \"effects\": {\n            \"detail\": 0,\n            \"flow\": 0,\n            \"stability\": 8\n          },\n          \"fact\": \"국보 78호와 83호 모두 밀랍 원형에 쇠못을 써서 속틀을 고정한 것이 확인되었습니다. 감마선 촬영에서 이 쇠못이 금속과 밀도가 달라 선명하게 드러납니다.\",\n          \"sayu\": \"무리하지 않는 선택이네. 나도 그 정도가 좋아.\"\n        },\n        {\n          \"id\": \"many\",\n          \"label\": \"8개 — 확실히 고정한다\",\n          \"sub\": \"안전하지만 흔적이 남음\",\n          \"effects\": {\n            \"detail\": -10,\n            \"flow\": 0,\n            \"stability\": 22\n          },\n          \"fact\": \"못을 많이 쓰면 속틀이 확실히 버티지만, 완성품 표면에 못 자리가 그만큼 남아 나중에 메워야 합니다.\",\n          \"sayu\": \"단단하긴 할 거야. 다만 내 몸에 자국이 좀 남겠지.\"\n        }\n      ]\n    }\n  ],\n  \"pour\": {\n    \"name\": \"쇳물 주입\",\n    \"step\": 4,\n    \"prompt\": \"거푸집을 가열해 밀랍을 녹여 빼내고, 녹인 금속을 붓습니다.\",\n    \"note\": \"쇳물이 너무 식으면 흐르지 못하고, 너무 뜨거우면 거푸집이 상합니다. 적정 구간에서 멈추세요.\",\n    \"guide\": \"스페이스바 또는 버튼으로 주입을 멈춥니다. 키보드만으로도 조작할 수 있습니다.\",\n    \"zone\": {\n      \"min\": 62,\n      \"max\": 82\n    },\n    \"near\": 8,\n    \"results\": {\n      \"perfect\": {\n        \"flow\": 15,\n        \"text\": \"적정 온도에서 정확히 멈췄습니다. 쇳물이 거푸집 끝까지 고르게 찼습니다.\"\n      },\n      \"near\": {\n        \"flow\": 0,\n        \"text\": \"적정 구간을 살짝 벗어났습니다. 대부분은 찼지만 끝부분이 아쉽습니다.\"\n      },\n      \"cold\": {\n        \"flow\": -15,\n        \"text\": \"쇳물이 식은 뒤에 멈췄습니다. 좁은 틈까지 흐르지 못했습니다.\"\n      },\n      \"hot\": {\n        \"flow\": -10,\n        \"text\": \"너무 뜨거운 상태로 오래 부었습니다. 거푸집 일부가 상했습니다.\"\n      }\n    }\n  },\n  \"repair\": {\n    \"prompt\": \"주조 결함이 발견되었습니다. 국보 83호도 같은 문제를 겪었고, 재주조와 부분 주조 끼움으로 수리했습니다. 한 번 결함이 생긴 주조는 수리를 거쳐도 완형이 되지는 않습니다.\",\n    \"options\": [\n      {\n        \"id\": \"recast\",\n        \"label\": \"결함 부위를 다시 주조한다\",\n        \"effects\": {\n          \"defects\": -3,\n          \"detail\": -8\n        },\n        \"fact\": \"결함이 심한 부분은 다시 녹여 주조했습니다. 많은 결함을 한 번에 없앨 수 있지만 원래 조형이 그만큼 달라집니다.\"\n      },\n      {\n        \"id\": \"insert\",\n        \"label\": \"부분을 따로 주조해 끼워 넣는다\",\n        \"effects\": {\n          \"defects\": -2,\n          \"detail\": -2\n        },\n        \"fact\": \"국보 83호에서는 부분을 따로 주조해 끼운 흔적이 확인되었습니다. 그래서 그 부위만 합금 비율이 다르게 나타납니다. XRF 분석으로 읽어 낸 바로 그 차이입니다.\"\n      },\n      {\n        \"id\": \"keep\",\n        \"label\": \"남은 결함을 그대로 두고 완성한다\",\n        \"effects\": {\n          \"defects\": 0,\n          \"detail\": 0\n        },\n        \"fact\": \"결함을 남긴 채 완성한 부분도 있습니다. 1400년 뒤 감마선 촬영이 그 흔적을 찾아내 당시의 공정을 알려 주었습니다. 흠이 기록이 된 셈입니다. 다만 남은 결함이 많으면 제 모습을 갖추지 못합니다.\"\n      }\n    ]\n  },\n  \"grades\": {\n    \"A\": {\n      \"badge\": \"완형 주조\",\n on\": \"유물을 깨지 않고 내부 구조를 확인할 때 쓰는 방법은 무엇인가요?\", \"options\": [\"감마선 촬영\", \"표면 연마\", \"조각 절단\"], \"answer\": 0 },\n    { \"id\": \"k8\", \"question\": \"밀랍 원형에 쇠못을 박은 이유는 무엇인가요?\", \"options\": [\"거푸집 안에서 속틀이 움직이지 않도록 고정하기 위해\", \"장식 효과를 내기 위해\", \"무게 중심을 낮추기 위해\"], \"answer\": 0 }\n  ],\n  \"experience\": [\n    \"발굴 과정에서 흙을 쓸어내며 조각을 찾는 일이 흥미로웠다.\",\n    \"토층 단서를 보고 조각의 위치를 추측해 볼 수 있었다.\",\n    \"확대경·감마선·성분분석 도구로 직접 조사하는 과정이 작품을 자세히 보게 했다.\",\n    \"밀랍주조 공정을 선택하면서 이 작품이 어떻게 만들어졌는지 이해하게 됐다.\",\n    \"주조 결함이 생긴 이유를 알고 나니 실제 유물을 다시 보고 싶어졌다.\",\n    \"사유 캐릭터의 질문이 다음 관찰로 이어지게 했다.\",\n    \"같은 조각을 다시 보러 간 적이 있다.\",\n    \"키보드 또는 마우스로 조작하기 쉬웠다.\"\n  ]\n}\n"};
  const realFetch = window.fetch ? window.fetch.bind(window) : null;
  window.fetch = (input, init) => {
